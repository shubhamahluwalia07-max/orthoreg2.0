{% extends 'base.html' %}

{% block title %}Change Password - Orthopedic Radiology Registry{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-6 glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden border border-slate-700/80">
    
    <!-- Top accent glow -->
    <div class="absolute -top-24 -left-24 w-56 h-56 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-56 h-56 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center relative">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-500 to-indigo-600 shadow-xl shadow-purple-500/25 mb-3 text-white text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        Change Password
      </h2>
      <p class="text-xs text-slate-400 mt-1.5">
        Update your account password for {{ current_user.display_email }}.
      </p>
    </div>

    <form class="space-y-4" method="POST" action="{{ url_for('change_password') }}">
      <div>
        <label for="current_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Current Password <span class="text-rose-400">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </div>
          <input id="current_password" name="current_password" type="password" required
                 placeholder="Enter your current password"
                 class="glass-input block w-full pl-10 pr-3 py-2.5 rounded-xl text-xs font-mono placeholder-slate-500">
        </div>
      </div>

      <div>
        <label for="new_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          New Password <span class="text-rose-400">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-key"></i>
          </div>
          <input id="new_password" name="new_password" type="password" minlength="6" required
                 placeholder="Min. 6 characters"
                 class="glass-input block w-full pl-10 pr-3 py-2.5 rounded-xl text-xs font-mono placeholder-slate-500">
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Confirm New Password <span class="text-rose-400">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-check-double"></i>
          </div>
          <input id="confirm_password" name="confirm_password" type="password" minlength="6" required
                 placeholder="Re-enter new password"
                 class="glass-input block w-full pl-10 pr-3 py-2.5 rounded-xl text-xs font-mono placeholder-slate-500">
        </div>
      </div>

      <button type="submit"
              class="w-full flex justify-center items-center py-2.5 px-4 rounded-xl text-xs font-semibold text-white bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-400 hover:to-indigo-500 shadow-lg shadow-purple-500/25 transition-all transform hover:-translate-y-0.5">
        <i class="fa-solid fa-floppy-disk mr-2"></i> Update Password
      </button>

      <div class="text-center pt-2">
        <a href="{{ url_for('dashboard') }}" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Return to Registry Dashboard
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
