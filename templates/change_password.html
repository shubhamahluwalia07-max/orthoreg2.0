{% extends 'base.html' %}

{% block title %}Change Password - Orthopedic Radiology Registry{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
  <div class="relative flex flex-col min-w-0 break-words bg-white dark:bg-slate-800 shadow-soft-xl dark:shadow-none rounded-2xl bg-clip-border max-w-md w-full p-8 sm:p-10 border border-gray-100 dark:border-slate-700">

    <!-- Header -->
    <div class="text-center relative">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-2xl mb-3 text-white text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-slate-800 dark:text-white flex items-center justify-center gap-2 mb-1">
        Change Password
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 mb-6">
        Update your account password for <strong class="font-mono text-purple-700 dark:text-purple-400">{{ current_user.display_email }}</strong>.
      </p>
    </div>

    <form class="space-y-4" method="POST" action="{{ url_for('change_password') }}">
      <div>
        <label for="current_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
          Current Password <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </div>
          <input id="current_password" name="current_password" type="password" required
                 placeholder="Enter your current password"
                 class="block w-full pl-10 pr-3 py-2.5 rounded-lg border border-solid border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-700 dark:text-white text-xs font-mono placeholder:text-gray-400 dark:placeholder:text-slate-400 focus:border-fuchsia-300 dark:focus:border-blue-500 focus:outline-none focus:shadow-soft-primary-outline transition-all">
        </div>
      </div>

      <div>
        <label for="new_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
          New Password <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-key"></i>
          </div>
          <input id="new_password" name="new_password" type="password" minlength="6" required
                 placeholder="Min. 6 characters"
                 class="block w-full pl-10 pr-3 py-2.5 rounded-lg border border-solid border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-700 dark:text-white text-xs font-mono placeholder:text-gray-400 dark:placeholder:text-slate-400 focus:border-fuchsia-300 dark:focus:border-blue-500 focus:outline-none focus:shadow-soft-primary-outline transition-all">
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
          Confirm New Password <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-check-double"></i>
          </div>
          <input id="confirm_password" name="confirm_password" type="password" minlength="6" required
                 placeholder="Re-enter new password"
                 class="block w-full pl-10 pr-3 py-2.5 rounded-lg border border-solid border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-700 dark:text-white text-xs font-mono placeholder:text-gray-400 dark:placeholder:text-slate-400 focus:border-fuchsia-300 dark:focus:border-blue-500 focus:outline-none focus:shadow-soft-primary-outline transition-all">
        </div>
      </div>

      <button type="submit"
              class="w-full flex justify-center items-center py-2.5 px-4 rounded-lg text-xs font-bold uppercase tracking-tight-soft text-white bg-gradient-to-tl from-purple-700 to-pink-500 shadow-soft-md hover:scale-102 hover:shadow-soft-2xl transition-all cursor-pointer">
        <i class="fa-solid fa-floppy-disk mr-2"></i> Update Password
      </button>

      <div class="text-center pt-2">
        <a href="{{ url_for('dashboard') }}" class="text-xs text-slate-500 dark:text-slate-400 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Return to Registry Dashboard
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
